# Render Blueprint for Lofn: New → Blueprint → pick this repo.
# One Docker web service runs the app and the worker together (they share the media disk),
# plus a managed PostgreSQL database.
databases:
  - name: lofn-db
    plan: basic-256mb
    region: frankfurt
    databaseName: lofn
    user: lofn
    postgresMajorVersion: "16"

services:
  - type: web
    name: lofn
    runtime: docker
    plan: starter            # persistent disks need a paid instance
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/start-all.mjs
    healthCheckPath: /api/health
    disk:
      name: lofn-media
      mountPath: /app/storage
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lofn-db
          property: connectionString
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /app/storage
      - key: WORKER_CONCURRENCY
        value: "3"
      # AI keys are not set here: every account adds its own key in the app (AI settings).
      # Encrypts those keys at rest. Keep it stable: changing it makes saved keys unreadable.
      - key: SECRETS_KEY
        generateValue: true
