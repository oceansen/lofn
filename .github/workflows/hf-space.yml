# Mirrors this repo to a Hugging Face Docker Space on every push to main.
# Setup: create a Docker Space, then add repository secret HF_TOKEN (write access)
# and repository variable HF_SPACE (e.g. "your-username/lofn").
name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Spaces read their config from README front matter.
          cat hf/SPACE_HEADER.md README.md > README.space.md && mv README.space.md README.md
          rm -rf .git && git init -q -b main
          git config user.name "lofn-sync" && git config user.email "lofn-sync@users.noreply.github.com"
          git add -A && git commit -qm "Sync from GitHub ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
