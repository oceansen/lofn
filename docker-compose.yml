# Local or single-host deployment: Postgres + app + worker.
# Usage: cp .env.example .env  (add your AI key), then: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lofn
      POSTGRES_PASSWORD: lofn
      POSTGRES_DB: lofn
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lofn"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://lofn:lofn@db:5432/lofn
      STORAGE_DIR: /app/storage
    ports: ["3000:3000"]
    volumes: [media:/app/storage]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: .
    command: ["npm", "run", "-s", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://lofn:lofn@db:5432/lofn
      STORAGE_DIR: /app/storage
    volumes: [media:/app/storage]   # local storage must be shared with the app (or use STORAGE_DRIVER=s3)
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  media:
